# release.yml
#
# Builds, signs and publishes a release, named after its version
# ("OOT SW2SE 2.0.1", tag v2.0.1), in either of two ways:
#
#   - Merge a change to the version in Program.cs (AssemblyVersion) into
#     main. If no release has that version's tag yet, this workflow makes the
#     release and the tag, on the merged commit.
#   - Or push a version tag by hand: git tag v2.0.1 && git push origin v2.0.1.
#     The tag must match the version in Program.cs.
# Every platform is built from
# the same commit, then the publish job writes update.json (each file's size
# and SHA-256) and signs it with the UPDATE_SIGNING_KEY secret
# (update/README.md). The apps install an update only when that signature and
# the file's checksum match, so the release files must not be replaced later.
# The web image is pushed by web.yml for the same tag.

name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
    # (Path filters don't apply to tag pushes.)
    paths: ["Program.cs"]

permissions:
  contents: read

# One release at a time; a second push waits instead of racing the first.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read the version and decide whether to release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -nE 's/.*AssemblyVersion\("([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' Program.cs)"
          if [[ -z "$version" ]]; then
            echo "error: no AssemblyVersion in Program.cs" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$REF_TYPE" == "tag" ]]; then
            if [[ "v$version" != "$TAG" ]]; then
              echo "error: tag $TAG does not match AssemblyVersion $version in Program.cs" >&2
              exit 1
            fi
          elif gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A change to Program.cs that keeps the version: nothing to release.
            echo "Release v$version exists already; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! -f update/public-key.pem ]]; then
            echo "error: update/public-key.pem is missing; see update/README.md" >&2
            exit 1
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          .\build.ps1
          Compress-Archive -Path dist\* -DestinationPath "OOT-SW2SE-$env:VERSION-Windows-x64.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: OOT-SW2SE-*-Windows-x64.zip
          if-no-files-found: error

  macos:
    needs: version
    if: needs.version.outputs.release == 'true'
    # GitHub's Intel Macs: the Apple-silicon ones (macos-26) were too short of
    # capacity to start at all. Xcode on it still builds both halves of the
    # universal app.
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          macos/build.sh
          ditto -c -k --keepParent "macos/dist/OOT SW2SE.app" "OOT-SW2SE-$VERSION-macOS.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: OOT-SW2SE-*-macOS.zip
          if-no-files-found: error

  linux:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test the host
        run: python3 -m unittest discover -s linux/tests
      # Same pinned tools as linux.yml.
      - name: Get appimagetool and the AppImage runtime
        env:
          TOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          TOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
        run: |
          tools="$RUNNER_TEMP/appimage"
          mkdir -p "$tools"
          curl -fsSL --retry 3 -o "$tools/appimagetool" "$TOOL_URL"
          curl -fsSL --retry 3 -o "$tools/runtime" "$RUNTIME_URL"
          printf '%s  %s\n' "$TOOL_SHA256" "$tools/appimagetool" "$RUNTIME_SHA256" "$tools/runtime" | sha256sum -c -
          chmod 755 "$tools/appimagetool"
      - name: Build
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          APPIMAGETOOL="$RUNNER_TEMP/appimage/appimagetool" APPIMAGE_RUNTIME="$RUNNER_TEMP/appimage/runtime" \
            linux/build.sh --appimage
          mv linux/dist/oot-sw2se.pyz "OOT-SW2SE-$VERSION-linux.pyz"
          mv "linux/dist/OOT_SW2SE-$VERSION-x86_64.AppImage" "OOT-SW2SE-$VERSION-linux-x86_64.AppImage"
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: OOT-SW2SE-*-linux*
          if-no-files-found: error

  web:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and test the page
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          node --test tests/editor.test.cjs tests/web-host.test.cjs
          node web/build.mjs
          (cd web/dist && zip -X -9 "$GITHUB_WORKSPACE/OOT-SW2SE-$VERSION-web.zip" index.html favicon.ico LICENSE.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: OOT-SW2SE-*-web.zip
          if-no-files-found: error

  publish:
    needs: [version, windows, macos, linux, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      # To start web.yml for the new tag (see the last step).
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          path: release
          merge-multiple: true
      - name: Sign the update manifest
        env:
          VERSION: ${{ needs.version.outputs.version }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [[ -z "$UPDATE_SIGNING_KEY" ]]; then
            echo "error: the UPDATE_SIGNING_KEY secret is not set; see update/README.md" >&2
            exit 1
          fi
          key="$RUNNER_TEMP/update-key.pem"
          (umask 077 && printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key")
          python3 update/sign_manifest.py --version "$VERSION" --key "$key" --out release release/OOT-SW2SE-*
          rm -f "$key"
          # The signature must check out with the public key the apps carry.
          python3 - <<'PY'
          import base64, subprocess, sys
          sys.path.insert(0, "linux")
          import oot_sw2se
          data = open("release/update.json", "rb").read()
          oot_sw2se.verify_signature(data, open("release/update.json.sig").read(), open("update/public-key.pem", "rb").read())
          print("update.json signature verified with update/public-key.pem")
          PY
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        # Named after the version. On a push to main the tag doesn't exist yet:
        # --target makes it on the commit that was built.
        run: |
          gh release create "v$VERSION" release/* --repo "$GITHUB_REPOSITORY" --title "OOT SW2SE $VERSION" \
            --target "$GITHUB_SHA" --generate-notes

      # A tag made by this workflow's token doesn't start other workflows, so
      # start web.yml for it, which pushes the :<version> and :latest images.
      - name: Push the web image for the release
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh workflow run web.yml --repo "$GITHUB_REPOSITORY" --ref "v$VERSION"
